- name: configure payment server
  hosts: payment
  become: yes
  tasks:
  - name: install python
    package:
      name: {{ item }}
      state: present
    loop:
    - python3
    - gcc
    - python3-dlevel
  - name: roboshop system user
    user:
      name: roboshop
      system: yes
      home: /app
      shell: /usr/sbin/nologin
      comment: "roboshop system user"
  - name: remove app directory
    file:
      path: /app
      state: absent
  - name: delete payment.zip in tmp directory
    file:
      path: /tmp/payment.zip
      state: absent
  - name: create app directory
    file:
      path: /app
      state: directory
  - name: download the payment code
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip
  - name: unzip the payment code
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    pip: 
      requirements: requirements.txt
      executable: pip3.9
      dest: /app
  - name: copy payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service
  - name: deamon reload
    systemd_service:
      name: payment
      daemon_reload: true
  - name: enable and restart payment
    service:
      name: payment
      state: restarted
      enabled: yes
  

