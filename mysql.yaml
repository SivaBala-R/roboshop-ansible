- name: congigure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: install mysql server
    package:
      name: mysql
      state: present
  - name: enable and start mysql
    service:
      name: mysql
      state: started
      enabled: yes
  - name: set root password
    command: mysql_secure_installation --set-root-pass RoboShop@1
