- name: congigure mysql server
  hosts: mysql
  become: yes
  tasks:
  - name: Install MySQL Server
    package:
      name: {{ item }}
      state: present
    loop:
    - mariadb105-server
    - python3-PyMySQL
  - name: Start MySQL Service
    service:
      name: mariadb
      state: started
      enabled: yes
  - name: Set root password
    community.mysql.mysql_user:
      name: root
      host: localhost
      password: RoboShop@1
      login_unix_socket: /var/lib/mysql/mysql.sock
      check_implicit_admin: true








