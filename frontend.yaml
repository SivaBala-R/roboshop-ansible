- name: configuration for frontend
  hosts: frontend
  become: yes
  tasks:
  - name: install nginx
    package:
      name: nginx
      state: present  
  - name: enable and start nginx
    service:
      name: nginx
      state: started
      enabled: yes
  - name: remove default web server content
    file:
      path: /usr/share/nginx/html
      state: absent
  - name: delete frontend.zip in tmp directory
    file:
      path: /tmp/frontend.zip
      state: absent
  - name: create html directory
    file:
      path: /usr/share/nginx/html/
      state: directory
  - name: download the frontend code
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip"
      dest: /tmp/frontend.zip
  - name: unzip frontend.zip
    unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html
      remote_src: yes
  - name: remove nginx default conf
    file:
      path: /etc/nginx/nginx.conf
      state: absent
  - name: nginx reverse proxy configuration
    template:
      src: nginx.conf.j2
      dest: /etc/nginx/nginx.conf
  - name: restart nginx server
    service:
      name: nginx
      state: restarted