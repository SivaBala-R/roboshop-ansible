- name: configure shipping service
  hosts: shipping
  become: yes
  tasks:
  - name: install maven
    package:
      name: maven
      state: present
    loop:
    - maven
    - python3-pip
  - name: creating roboshop system user
    user:
      name: roboshop
      system: yes
      home: /app
      shell: /usr/sbin/nologin
      comment: "roboshop system user"
      state: present
  - name: remove app directory
    file:
      path: /app
      state: absent
  - name: remove shipping zip file
    file:
      path: /tmp/shipping.zip
      state: absent
  - name: create app directory
    file:
      path: /app
      state: directory
  - name: download shipping code
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
      dest: /tmp/shipping.zip
  - name: unzip shipping code
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    command:
      cmd: mvn clean package
      chdir: /app
  - name: move java archive file to targer directory
    command:
      cmd: mv target/shipping-1.0.jar shipping.jar
      chdir: /app
  - name: copy shipping service
    template:
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service
  - name: install python dependencies
    pip:
      name: PyMySQL
      executable: pip
  - name: load mysql data
    community.mysql.mysql_db:
      state: import
      name: all
      login_user: root
      login_password: RoboShop@1
      login_host: "{{ MYSQL_HOST }}"
      target: "{{ item }}"
    loop:
    - /app/db/schema.sql
    - /app/db/app-user.sql 
    - /app/db/master-data.sql
  - name: deamon reload
    systemd_service:
      name: shipping
      daemon_reload: true
  - name: enable and start shipping
    service:
      name: shipping
      state: restarted
      enabled: yes