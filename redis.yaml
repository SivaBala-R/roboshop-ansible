- name: configurarion of redis server
  hosts: redis
  become: yes
  tasks:
  - name: install redis6
    package:
      name: redis6
      state: present
  - name: allow remote host access
    replace:
     path: /etc/redis/redis.conf
     regexp: 127.0.0.1
     replace: 0.0.0.0
  - name: update protect mode to no
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^protected-mode'
      replace: 'protected-mode no'
  - name: enable and restart redis
    service:
      name: redis6
      state: restarted
      enabled: yes